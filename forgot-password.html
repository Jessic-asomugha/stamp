<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password | Stamp</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="auth" data-mode="forgot">
<header id="site-header"></header>
<main id="main"><div class="auth"><div class="wrap" style="display:grid;place-items:center">
  <div class="form-card" style="width:min(440px,100%)">
    <form id="auth-form" novalidate>
      <h1 style="font-size:2rem">Forgot your password?</h1>
      <p class="muted">Enter your email. We send a link that logs you in and lets you set a new password.</p>
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
      <button class="btn" style="width:100%">Send link</button>
      <p class="small muted" style="margin-top:1rem"><a href="login.html">Back to log in</a></p>
    </form>
    <div id="auth-sent" hidden>
      <h2>Check your email</h2>
      <p>If an account exists for <b id="sent-email"></b>, a link is on its way.</p>
      <a class="btn ghost" href="login.html">Back to log in</a>
    </div>
  </div>
</div></div></main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script><script src="js/main.js"></script>
</body>
</html>
