<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create an account | Stamp</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="auth" data-mode="signup">
<header id="site-header"></header>
<main id="main"><div class="auth"><div class="wrap" style="display:grid;place-items:center">
  <div class="form-card" style="width:min(440px,100%)">
    <form id="auth-form" novalidate>
      <h1 style="font-size:2rem">Create an account</h1>
      <p class="muted">Already sent a request? Your account was created when you confirmed your email. <a href="login.html">Log in</a>.</p>
      <div class="field"><label for="fullname">Full name</label><input id="fullname" name="fullname" autocomplete="name" required><div class="err"></div></div>
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
      <div class="field" id="pw-field" hidden><label for="password">Password <span class="hint">(optional)</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8"></div>
      <button class="btn" style="width:100%">Create account</button>
      <p class="small" style="margin:1rem 0 0"><a href="#" id="pw-toggle">Use a password instead</a></p>
    </form>
    <div id="auth-sent" hidden>
      <h2>Check your email</h2>
      <p>We sent a link to <b id="sent-email"></b>. It confirms your email and logs you in.</p>
      <div class="notice"><b>Demo only:</b> use the button as if you clicked the link.</div>
      <button class="btn" id="demo-link">Open the link</button>
    </div>
  </div>
</div></div></main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script><script src="js/main.js"></script>
</body>
</html>
